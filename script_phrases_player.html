<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA実況 台本集 音声プレイヤー</title>
<style>
  :root {
    --bg:#0f0d0b; --panel:#1a1613; --amber:#ff8c2e; --amber-dim:#7a4518;
    --text:#f5efe8; --text-dim:#9a8f83; --green:#4ade80;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--text);
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
    padding:20px; max-width:820px; margin:0 auto;
  }
  .eyebrow { color:var(--text-dim); font-size:13px; letter-spacing:1px; }
  h1 { font-size:26px; margin:4px 0 20px; }
  h1 span { color:var(--amber); }
  a.back { color:var(--text-dim); font-size:13px; text-decoration:none; display:inline-block; margin-bottom:16px; }

  .filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .chip {
    background:var(--panel); border:1px solid var(--amber-dim); color:var(--text-dim);
    border-radius:999px; padding:8px 14px; font-size:13px; cursor:pointer;
  }
  .chip.active { background:var(--amber); color:#1a1613; border-color:var(--amber); font-weight:700; }

  .card {
    background:var(--panel); border:2px solid var(--amber-dim); border-radius:18px;
    padding:32px 26px; margin-bottom:16px; text-align:center; min-height:240px;
    display:flex; flex-direction:column; justify-content:center;
  }
  .cat-tag {
    display:inline-block; align-self:center; background:rgba(255,140,46,0.12);
    border:1px solid var(--amber-dim); color:var(--amber);
    border-radius:999px; padding:4px 14px; font-size:12px; margin-bottom:20px;
  }
  .en { font-size:24px; line-height:1.6; font-weight:500; margin-bottom:20px; word-break:break-word; }
  .en b { color:var(--amber); font-weight:800; }
  .en.hidden { opacity:0.15; }
  .jp { font-size:15px; color:var(--text-dim); line-height:1.7; margin-bottom:16px; }
  .jp.hidden { display:none; }
  .kwbox {
    background:rgba(255,140,46,0.07); border:1px solid var(--amber-dim);
    border-radius:10px; padding:12px 14px; font-size:13px; color:var(--text-dim);
    text-align:left; line-height:1.7;
  }
  .kwbox.hidden { display:none; }
  .kwbox b { color:var(--amber); }

  .progress { height:4px; background:var(--panel); border-radius:2px; margin:6px 0; overflow:hidden; }
  .progress-bar { height:100%; background:var(--amber); width:0%; transition:width .2s; }
  .plabel { display:flex; justify-content:space-between; font-size:12px; color:var(--text-dim); margin-bottom:16px; }

  .controls { display:flex; gap:12px; align-items:center; justify-content:center; margin-bottom:16px; }
  .btn { background:var(--panel); border:1px solid var(--amber-dim); color:var(--text); border-radius:50%;
    width:52px; height:52px; font-size:18px; cursor:pointer; }
  .btn.play { background:var(--amber); color:#1a1613; width:64px; height:64px; font-size:24px; border:none; }

  .settings { display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-bottom:20px; }
  .setting { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .setting label { font-size:11px; color:var(--text-dim); }
  .setting select {
    background:var(--panel); color:var(--text); border:1px solid var(--amber-dim);
    border-radius:8px; padding:6px 10px; font-size:13px;
  }

  .list { margin-top:10px; }
  .list h3 { font-size:13px; color:var(--text-dim); margin-bottom:10px; }
  .row {
    background:var(--panel); border-radius:8px; padding:12px 14px; margin-bottom:6px;
    cursor:pointer; border:1px solid transparent;
  }
  .row:hover { border-color:var(--amber-dim); }
  .row.current { border-color:var(--amber); }
  .row .ren { font-size:14px; }
  .row .ren b { color:var(--amber); }
  .row .rjp { font-size:11px; color:var(--text-dim); margin-top:3px; }
</style>
</head>
<body>
  <a class="back" href="index.html">← トップに戻る</a>
  <div class="eyebrow">GTA6 英語実況 / 台本集 音声版</div>
  <h1>実況<span>台本</span>集 <span style="font-size:16px;">(175本)</span></h1>

  <div class="filters" id="filters"></div>

  <div class="card">
    <div class="cat-tag" id="catTag"></div>
    <div class="en" id="enText">▶ を押すと再生します</div>
    <div class="jp hidden" id="jpText"></div>
    <div class="kwbox hidden" id="kwBox"></div>
  </div>

  <div class="progress"><div class="progress-bar" id="pbar"></div></div>
  <div class="plabel"><span id="curIdx">0</span><span id="totIdx">0</span></div>

  <div class="controls">
    <button class="btn" id="prevBtn">⏮</button>
    <button class="btn play" id="playBtn">▶</button>
    <button class="btn" id="nextBtn">⏭</button>
  </div>

  <div class="settings">
    <div class="setting">
      <label>読み上げ速度</label>
      <select id="rate">
        <option value="0.7">ゆっくり (0.7x)</option>
        <option value="0.85" selected>やや遅め (0.85x)</option>
        <option value="1">普通 (1.0x)</option>
      </select>
    </div>
    <div class="setting">
      <label>リピート</label>
      <select id="repeat">
        <option value="1" selected>1回</option>
        <option value="2">2回</option>
        <option value="3">3回</option>
      </select>
    </div>
    <div class="setting">
      <label>自動で次へ</label>
      <select id="autoNext">
        <option value="yes" selected>する</option>
        <option value="no">しない</option>
      </select>
    </div>
    <div class="setting">
      <label>日本語表示</label>
      <select id="showJp">
        <option value="yes" selected>する</option>
        <option value="no">しない</option>
      </select>
    </div>
    <div class="setting">
      <label>次までの間</label>
      <select id="gap">
        <option value="1500">1.5秒</option>
        <option value="2500" selected>2.5秒</option>
        <option value="4000">4秒</option>
      </select>
    </div>
  </div>

  <div class="list">
    <h3 id="listTitle">一覧(タップで移動)</h3>
    <div id="listBox"></div>
  </div>

];
// ===== 状態 =====
let curIndex = 0;
let filtered = [];
let activeCat = 'all';
let isPlaying = false;
let repeatCount = 0;
let synth = window.speechSynthesis;
let enVoice = null, jaVoice = null;
let timer = null;

function loadVoices() {
  const vs = synth.getVoices();
  enVoice = vs.find(v => v.lang.startsWith('en')) || null;
  jaVoice = vs.find(v => v.lang.startsWith('ja')) || null;
}
loadVoices();
if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;

// **太字** をHTMLの<b>に
function boldify(s) {
  return escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}
// 読み上げ用に**を除去
function plain(s) { return s.replace(/\*\*/g, ''); }
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// カテゴリchip
const cats = ['all', ...new Set(DATA.map(d => d.cat))];
const catLabel = { all: 'すべて' };
function buildFilters() {
  const box = document.getElementById('filters');
  box.innerHTML = '';
  cats.forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (activeCat === c ? ' active' : '');
    const n = c === 'all' ? DATA.length : DATA.filter(d => d.cat === c).length;
    chip.textContent = (catLabel[c] || c) + ' (' + n + ')';
    chip.onclick = () => { activeCat = c; stop(); applyFilter(); buildFilters(); };
    box.appendChild(chip);
  });
}

function applyFilter() {
  filtered = DATA.filter(d => activeCat === 'all' || d.cat === activeCat);
  curIndex = 0;
  render();
  renderList();
}

function render() {
  const showJp = document.getElementById('showJp').value === 'yes';
  document.getElementById('totIdx').textContent = filtered.length;
  if (filtered.length === 0) return;
  const item = filtered[curIndex];
  document.getElementById('catTag').textContent = item.cat;
  document.getElementById('enText').innerHTML = boldify(item.en);
  document.getElementById('enText').classList.remove('hidden');
  const jpEl = document.getElementById('jpText');
  jpEl.textContent = item.jp;
  jpEl.className = 'jp' + (showJp ? '' : ' hidden');
  const kw = document.getElementById('kwBox');
  kw.innerHTML = '<b>熟語:</b> ' + escapeHtml(item.kw);
  kw.className = 'kwbox';
  document.getElementById('curIdx').textContent = curIndex + 1;
  document.getElementById('pbar').style.width = ((curIndex+1)/filtered.length*100) + '%';
  renderList();
}

function renderList() {
  const box = document.getElementById('listBox');
  box.innerHTML = '';
  filtered.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'row' + (i === curIndex ? ' current' : '');
    row.innerHTML = '<div class="ren">' + boldify(item.en) + '</div><div class="rjp">' + escapeHtml(item.jp) + '</div>';
    row.onclick = () => { stop(); curIndex = i; render(); window.scrollTo({top:0,behavior:'smooth'}); };
    box.appendChild(row);
  });
}

function speak() {
  if (filtered.length === 0) return;
  const item = filtered[curIndex];
  const rate = parseFloat(document.getElementById('rate').value);
  const u = new SpeechSynthesisUtterance(plain(item.en));
  u.lang = 'en-US';
  if (enVoice) u.voice = enVoice;
  u.rate = rate;
  u.onend = () => {
    repeatCount++;
    const rep = parseInt(document.getElementById('repeat').value);
    if (repeatCount < rep) { if (isPlaying) speak(); return; }
    repeatCount = 0;
    if (isPlaying && document.getElementById('autoNext').value === 'yes') {
      const gap = parseInt(document.getElementById('gap').value);
      timer = setTimeout(() => { if (isPlaying) { goNext(true); } }, gap);
    } else {
      isPlaying = false;
      document.getElementById('playBtn').textContent = '▶';
    }
  };
  synth.cancel();
  synth.speak(u);
}

function goNext(auto) {
  curIndex = (curIndex + 1) % filtered.length;
  render();
  if (isPlaying) speak();
}
function goPrev() {
  curIndex = (curIndex - 1 + filtered.length) % filtered.length;
  render();
  if (isPlaying) speak();
}
function stop() {
  isPlaying = false;
  repeatCount = 0;
  clearTimeout(timer);
  synth.cancel();
  document.getElementById('playBtn').textContent = '▶';
}

document.getElementById('playBtn').onclick = () => {
  isPlaying = !isPlaying;
  document.getElementById('playBtn').textContent = isPlaying ? '⏸' : '▶';
  if (isPlaying) { repeatCount = 0; speak(); }
  else stop();
};
document.getElementById('nextBtn').onclick = () => { stop(); goNext(); };
document.getElementById('prevBtn').onclick = () => { stop(); goPrev(); };
document.getElementById('showJp').onchange = render;

buildFilters();
applyFilter();
</script>
