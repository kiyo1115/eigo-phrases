<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>実況カンペ - 音声で英語フレーズ検索</title>
<style>
  :root {
    --bg: #0f0d0b;
    --panel: #1a1613;
    --amber: #ff8c2e;
    --amber-dim: #7a4518;
    --text: #f5efe8;
    --text-dim: #9a8f83;
    --green: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    min-height: 100vh;
    padding: 20px;
  }
  .layout {
    display: flex;
    gap: 24px;
    max-width: 1200px;
    margin: 0 auto;
    align-items: flex-start;
  }
  .main-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 0;
  }
  .side-col {
    width: 320px;
    flex-shrink: 0;
  }
  @media (max-width: 900px) {
    .layout { flex-direction: column; }
    .side-col { width: 100%; }
  }
  .header { text-align: center; margin-bottom: 20px; }
  .header h1 { font-size: 22px; color: var(--amber); }
  .header .sub { font-size: 13px; color: var(--text-dim); margin-top: 6px; }

  .mic-status {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border-radius: 999px;
    padding: 10px 20px; margin-bottom: 24px;
    border: 1px solid var(--amber-dim);
  }
  .mic-dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #555; transition: background .2s;
  }
  .mic-dot.on { background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.4;} }
  .mic-label { font-size: 14px; }

  #toggleBtn {
    background: var(--amber); color: #1a1613; border: none;
    padding: 14px 32px; border-radius: 12px; font-size: 17px;
    font-weight: 700; cursor: pointer; margin-bottom: 28px;
  }
  #toggleBtn.listening { background: #5a3030; color: #ffb3b3; }

  .result-card {
    width: 100%; max-width: 640px;
    background: var(--panel); border: 2px solid var(--amber);
    border-radius: 20px; padding: 40px 30px; text-align: center;
    min-height: 200px; display: flex; flex-direction: column;
    justify-content: center; margin-bottom: 20px;
  }
  .result-en {
    font-size: 42px; font-weight: 800; color: var(--amber);
    line-height: 1.3; margin-bottom: 16px; word-break: break-word;
  }
  .result-jp { font-size: 18px; color: var(--text-dim); }
  .result-empty { font-size: 20px; color: var(--text-dim); }

  .heard {
    font-size: 18px; color: var(--text);
    margin-bottom: 12px; min-height: 26px; font-weight: 700;
    background: var(--panel); border-radius: 10px; padding: 12px 18px;
    width: 100%; max-width: 640px; text-align: center;
    border: 1px solid var(--amber-dim);
  }
  .heard span { color: var(--amber); }
  .heard.pulse { border-color: var(--green); }
  .match-info {
    font-size: 13px; color: var(--text-dim); margin-bottom: 20px;
    min-height: 18px; text-align: center;
  }
  .match-info.hit { color: var(--green); }
  .match-info.miss { color: #ff9080; }

  .controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
  .ctrl {
    background: var(--panel); border: 1px solid var(--amber-dim);
    border-radius: 10px; padding: 8px 14px; font-size: 13px;
    color: var(--text-dim); display: flex; align-items: center; gap: 8px;
  }
  .ctrl select, .ctrl input {
    background: #0f0d0b; color: var(--text); border: 1px solid var(--amber-dim);
    border-radius: 6px; padding: 4px 8px; font-size: 13px;
  }

  .history {
    background: var(--panel); border-radius: 14px; padding: 16px;
    border: 1px solid var(--amber-dim);
    position: sticky; top: 20px;
  }
  .history h3 { font-size: 14px; color: var(--amber); margin-bottom: 12px; }
  .hist-item {
    background: var(--bg); border-radius: 10px; padding: 12px 14px;
    margin-bottom: 8px; cursor: pointer;
    border: 1px solid transparent; transition: border-color .15s, transform .1s;
  }
  .hist-item:hover { border-color: var(--amber); transform: translateX(-2px); }
  .hist-item:active { transform: scale(0.98); }
  .hist-en { color: var(--amber); font-weight: 700; font-size: 16px; display: block; margin-bottom: 3px; }
  .hist-jp { color: var(--text-dim); font-size: 12px; display: block; }
  .hist-empty { color: var(--text-dim); font-size: 13px; text-align: center; padding: 20px 0; }

  .err { color: #ff8080; font-size: 13px; margin-top: 10px; text-align: center; max-width: 640px; }
</style>
</head>

  <div class="header">
    <h1>実況カンペ</h1>

      <div class="result-card">

        </div>
      </div>

      <div class="controls">
        <div class="ctrl">
          <label>最低一致度</label>
          <select id="threshold">
            <option value="0.15">かなりゆるい</option>
            <option value="0.25" selected>ゆるい</option>
            <option value="0.35">普通</option>
            <option value="0.5">厳しい</option>
          </select>
        </div>
        <div class="ctrl">
          <label>英語を読み上げ</label>
          <select id="speakToggle">
            <option value="no" selected>しない</option>
            <option value="yes">する</option>
          </select>
        </div>
      </div>

      <div id="errBox" class="err"></div>
    </div>

    <div class="side-col">
      <div class="history">
        <h3>履歴(クリックで再表示)</h3>
        <div id="historyList"><div class="hist-empty">まだありません</div></div>
      </div>
    </div>

// ===== 照合ロジック =====
// ひらがな正規化 + 記号除去で比較しやすくする
function normalize(s) {
  if (!s) return '';
  s = s.replace(/[。、！？!?・「」()（）\s]/g, '');
  // カタカナ→ひらがな
  s = s.replace(/[\u30a1-\u30f6]/g, m => String.fromCharCode(m.charCodeAt(0) - 0x60));
  return s;
}

// bigram(2文字組)集合を作る
function bigrams(s) {
  const g = new Set();
  for (let i = 0; i < s.length - 1; i++) g.add(s.slice(i, i + 2));
  if (s.length === 1) g.add(s);
  return g;
}

// Dice係数で類似度を測る(0〜1)
function similarity(a, b) {
  const A = bigrams(a), B = bigrams(b);
  if (A.size === 0 || B.size === 0) return 0;
  let inter = 0;
  A.forEach(x => { if (B.has(x)) inter++; });
  return (2 * inter) / (A.size + B.size);
}

  p._core = normalize(p.core);
  p._clean = normalize(p.clean);
});

function findBest(heard) {
  const h = normalize(heard);
  if (!h || h.length < 2) return null;
  let best = null, bestScore = 0;
  for (const p of PHRASES) {
    const s1 = similarity(h, p._core);
    const s2 = similarity(h, p._clean);
    let score = Math.max(s1, s2);
    // 包含ボーナス(双方向): 聞いた文に核が含まれる or 核に聞いた文が含まれる
    if (p._core.length >= 2) {
      if (h.includes(p._core)) score += 0.35;          // 「〇〇だよ」の中に核がある
      else if (p._core.includes(h) && h.length >= 3) score += 0.25; // 核の一部を言った
    }
    // 連続部分一致ボーナス: 3文字以上の共通部分列があれば加点
    const common = longestCommonSubstr(h, p._core);
    if (common >= 3) score += 0.15 * (common / Math.max(h.length, p._core.length));
    if (score > bestScore) { bestScore = score; best = p; }
  }
  return best ? { phrase: best, score: bestScore } : null;
}

// 最長共通部分文字列の長さ
function longestCommonSubstr(a, b) {
  if (!a || !b) return 0;
  let max = 0;
  const dp = new Array(b.length + 1).fill(0);
  for (let i = 1; i <= a.length; i++) {
    let prev = 0;
    for (let j = 1; j <= b.length; j++) {
      const tmp = dp[j];
      if (a[i-1] === b[j-1]) { dp[j] = prev + 1; if (dp[j] > max) max = dp[j]; }
      else dp[j] = 0;
      prev = tmp;
    }
  }
  return max;
}

// ===== 音声認識 =====
let recognition = null;
let listening = false;
const micDot = document.getElementById('micDot');
const micLabel = document.getElementById('micLabel');
const toggleBtn = document.getElementById('toggleBtn');
const heardEl = document.getElementById('heard');
const matchInfoEl = document.getElementById('matchInfo');
const resultArea = document.getElementById('resultArea');
const errBox = document.getElementById('errBox');
const historyList = document.getElementById('historyList');
const history = [];

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) {
  errBox.textContent = 'このブラウザは音声認識に対応していません。Google Chromeで開いてください。';
  toggleBtn.disabled = true;
} else {
  recognition = new SR();
  recognition.lang = 'ja-JP';
  recognition.continuous = true;      // 連続認識
  recognition.interimResults = true;  // 途中結果も拾う
  recognition.maxAlternatives = 5;    // 認識候補を複数もらって照合精度を上げる

  recognition.onresult = (event) => {
    let interim = '', final = '';
    let alternatives = []; // 認識候補を集める
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const res = event.results[i];
      const t = res[0].transcript;
      // 候補(alternatives)を全部集める
      for (let j = 0; j < res.length; j++) alternatives.push(res[j].transcript);
      if (res.isFinal) final += t;
      else interim += t;
    }
    if (interim) {
      heardEl.innerHTML = '聞き取り中… <span>' + escapeHtml(interim) + '</span>';
      heardEl.classList.add('pulse');
      // 途中経過でも照合して素早く反応(拾いやすくする)
      handleHeard(interim, alternatives, true);
    }
    if (final) {
      heardEl.innerHTML = '認識: <span>' + escapeHtml(final) + '</span>';
      heardEl.classList.remove('pulse');
      handleHeard(final, alternatives, false);
    }
  };

  recognition.onerror = (e) => {
    if (e.error === 'no-speech' || e.error === 'aborted') return; // 無音は無視
    errBox.textContent = '音声認識エラー: ' + e.error;
  };

  recognition.onend = () => {
    // 連続待ち受け: 勝手に止まったら再開
    if (listening) {
      try { recognition.start(); } catch (err) {}
    }
  };
}

function handleHeard(text, alternatives, isInterim) {
  const threshold = parseFloat(document.getElementById('threshold').value);
  // 認識候補すべてで照合し、最も高いスコアを採用(拾いやすくする)
  const candidates = alternatives && alternatives.length ? alternatives : [text];
  let best = null;
  for (const cand of candidates) {
    const r = findBest(cand);
    if (r && (!best || r.score > best.score)) best = r;
  }
  if (best && best.score >= threshold) {
    matchInfoEl.className = 'match-info hit';
    matchInfoEl.textContent = '✓ マッチ (一致度 ' + best.score.toFixed(2) + ')';
    showResult(best.phrase);
  } else if (!isInterim) {
    // 確定時のみ「近い候補」「該当なし」を表示(途中経過ではちらつかせない)
    if (best) {
      matchInfoEl.className = 'match-info miss';
      matchInfoEl.textContent = '△ 近い候補: ' + best.phrase.en + ' (一致度 ' + best.score.toFixed(2) + ' / 閾値 ' + threshold + ')';
    } else {
      matchInfoEl.className = 'match-info miss';
      matchInfoEl.textContent = '該当なし';
    }
  }
}

let currentEn = null;
function showResult(p, fromHistory) {
  // 同じフレーズが連続したら何もしない(ちらつき防止)
  if (!fromHistory && currentEn === p.en) return;
  currentEn = p.en;
  resultArea.innerHTML =
    '<div class="result-en">' + escapeHtml(p.en) + '</div>' +
    '<div class="result-jp">' + escapeHtml(p.jp) + '</div>';

  // 履歴に追加(履歴クリックからの再表示では追加しない)
  if (!fromHistory) {
    // 既に履歴にある同じものは一旦除いて先頭へ(重複を防ぎ最新順に)
    const idx = history.findIndex(h => h.en === p.en);
    if (idx !== -1) history.splice(idx, 1);
    history.unshift(p);
    if (history.length > 10) history.pop();
    renderHistory();
  }

  // 英語読み上げ
  if (document.getElementById('speakToggle').value === 'yes') {
    speakEn(p.en);
  }
}

function renderHistory() {
  if (history.length === 0) {
    historyList.innerHTML = '<div class="hist-empty">まだありません</div>';
    return;
  }
  historyList.innerHTML = history.map((p, i) =>
    '<div class="hist-item" data-i="' + i + '">' +
    '<span class="hist-en">' + escapeHtml(p.en) + '</span>' +
    '<span class="hist-jp">' + escapeHtml(p.jp) + '</span></div>'
  ).join('');
  // クリックでそのフレーズを大きく再表示
  [...historyList.querySelectorAll('.hist-item')].forEach(el => {
    el.onclick = () => {
      const p = history[parseInt(el.dataset.i)];
      if (p) showResult(p, true);
    };
  });
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 英語読み上げ
let enVoice = null;
function loadVoice() {
  const voices = speechSynthesis.getVoices();
  enVoice = voices.find(v => v.lang.startsWith('en')) || null;
}
if ('speechSynthesis' in window) {
  loadVoice();
  speechSynthesis.onvoiceschanged = loadVoice;
}
function speakEn(text) {
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  if (enVoice) u.voice = enVoice;
  u.rate = 0.95;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

// ===== 開始/停止 =====
toggleBtn.onclick = () => {
  if (!recognition) return;
  listening = !listening;
  if (listening) {
    try { recognition.start(); } catch (err) {}
    micDot.classList.add('on');
    micLabel.textContent = '待ち受け中';
    toggleBtn.textContent = '■ 停止';
    toggleBtn.classList.add('listening');
    errBox.textContent = '';
  } else {
    recognition.stop();
    micDot.classList.remove('on');
    micLabel.textContent = '停止中';
    toggleBtn.textContent = '▶ 待ち受け開始';
    toggleBtn.classList.remove('listening');
  }
};
</script>
