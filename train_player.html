<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>とっさ訓練 - 場面連続モード</title>
<style>
  :root{--bg:#0f0d0b;--panel:#1a1613;--amber:#ff8c2e;--amber-dim:#7a4518;--text:#f5efe8;--dim:#9a8f83;--green:#4ade80;--red:#ff8080;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;padding:16px;max-width:760px;margin:0 auto;}
  a.back{color:var(--dim);font-size:13px;text-decoration:none;display:inline-block;margin-bottom:12px;}
  .eyebrow{color:var(--dim);font-size:12px;letter-spacing:1px;}
  h1{font-size:24px;margin:4px 0 6px;}
  h1 span{color:var(--amber);}
  .lead{font-size:13px;color:var(--dim);line-height:1.7;margin-bottom:18px;}

  .stage{background:var(--panel);border:2px solid var(--amber-dim);border-radius:18px;
    padding:36px 22px;text-align:center;min-height:230px;display:flex;flex-direction:column;
    justify-content:center;align-items:center;margin-bottom:14px;}
  .cat{display:inline-block;background:rgba(255,140,46,.12);border:1px solid var(--amber-dim);
    color:var(--amber);border-radius:999px;padding:4px 14px;font-size:12px;margin-bottom:18px;}
  .scene{font-size:30px;font-weight:800;line-height:1.5;margin-bottom:14px;}
  .hint{font-size:13px;color:var(--dim);min-height:20px;}
  .answer{margin-top:18px;padding-top:16px;border-top:1px dashed var(--amber-dim);width:100%;display:none;}
  .answer .en{font-size:26px;font-weight:800;color:var(--amber);}
  .answer .jp{font-size:14px;color:var(--dim);margin-top:6px;}
  .idle{font-size:18px;color:var(--dim);}

  .timerbar{height:5px;background:#262019;border-radius:3px;overflow:hidden;margin-bottom:16px;}
  .timerfill{height:100%;background:var(--amber);width:100%;}

  .ctrls{display:flex;gap:10px;justify-content:center;margin-bottom:18px;flex-wrap:wrap;}
  .btn{border:none;border-radius:12px;padding:14px 26px;font-size:16px;font-weight:700;cursor:pointer;}
  .btn.main{background:var(--amber);color:#1a1613;}
  .btn.stop{background:#5a3030;color:#ffb3b3;}
  .btn.sub{background:var(--panel);color:var(--text);border:1px solid var(--amber-dim);font-size:14px;padding:12px 18px;}

  .settings{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:18px;}
  .set{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .set label{font-size:11px;color:var(--dim);}
  .set select{background:var(--panel);color:var(--text);border:1px solid var(--amber-dim);border-radius:8px;padding:6px 10px;font-size:13px;}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px;}
  .chip{background:var(--panel);border:1px solid var(--amber-dim);color:var(--dim);border-radius:999px;padding:7px 13px;font-size:12px;cursor:pointer;}
  .chip.on{background:var(--amber);color:#1a1613;border-color:var(--amber);font-weight:700;}

  .judge{display:none;gap:12px;justify-content:center;margin-bottom:16px;}
  .judge button{flex:1;max-width:220px;border:none;border-radius:14px;padding:18px 10px;font-size:18px;font-weight:800;cursor:pointer;}
  #judgeOk{background:#2f4a30;color:#b3ffb8;}
  #judgeNg{background:#5a3030;color:#ffb3b3;}
  .judge small{display:block;font-size:11px;font-weight:400;opacity:.7;margin-top:3px;}
  .retry-tag{display:inline-block;margin-left:6px;background:#5a3030;color:#ffb3b3;border-radius:999px;padding:3px 10px;font-size:11px;}
  .waiting .hint{color:var(--amber);font-weight:700;}
  .counter{text-align:center;font-size:13px;color:var(--dim);margin-bottom:10px;}
  .note{background:var(--panel);border-radius:12px;padding:14px 16px;font-size:12.5px;color:var(--dim);line-height:1.8;}
  .note b{color:var(--amber);}
</style>
</head>
<body>
  <a class="back" href="index.html">← トップに戻る</a>
  <div class="eyebrow">とっさ訓練 / 場面連続モード</div>
  <h1>とっさに<span>言う</span>訓練</h1>
  <div class="lead">
    場面だけが次々に出ます。答えは出ません。<br>
    表示された瞬間に、思いついた英語を<b>声に出して</b>ください。合っているかは気にしない。止まらず出すことが目的です。
  </div>

  <div class="chips" id="chips"></div>

  <div class="timerbar"><div class="timerfill" id="timerfill"></div></div>

  <div class="stage">
    <div id="stageInner">
      <div class="idle">▶ を押すと場面が流れ始めます</div>
    </div>
  </div>

  <div class="counter"><span id="cycle">1</span>周目 ・ <span id="done">0</span> / <span id="total">0</span> ・ 合計 <span id="count">0</span> 場面<span id="judgeStat"></span></div>

  <div class="judge" id="judgeRow">
    <button id="judgeOk">○ 言えた<small>後回しにする (キー 1)</small></button>
    <button id="judgeNg">× 言えなかった<small>すぐまた出す (キー 2)</small></button>
  </div>

  <div class="ctrls">
    <button class="btn main" id="startBtn">▶ 開始</button>
    <button class="btn sub" id="revealBtn">答えを見る</button>
    <button class="btn sub" id="speakEnBtn">🔊 英語を聞く</button>
    <button class="btn sub" id="skipBtn">次へ ⏭</button>
  </div>

  <div class="settings">
    <div class="set">
      <label>練習セット</label>
      <select id="setSel">
        <option value="all" selected>まとめて(実況95)</option>
        <option value="core">優先50語</option>
        <option value="tsukkomi">ツッコミ55</option>
        <option value="verb">動詞フレーズ54</option>
        <option value="pair">2文セット91</option>
        <option value="link">つながり46（2文目を続ける）</option>
        <option value="particle">句動詞 get ○○（61）</option>
      </select>
    </div>
    <div class="set">
      <label>1場面の長さ</label>
      <select id="gap">
        <option value="3000">3秒(速い)</option>
        <option value="5000" selected>5秒</option>
        <option value="8000">8秒</option>
        <option value="12000">12秒</option>
        <option value="20000">20秒(じっくり)</option>
      </select>
    </div>
    <div class="set">
      <label>答えの表示</label>
      <select id="showAns">
        <option value="never" selected>出さない</option>
        <option value="after">場面の最後に出す</option>
        <option value="always">常に出す</option>
      </select>
    </div>
    <div class="set">
      <label>判定モード</label>
      <select id="judgeMode">
        <option value="off" selected>オフ</option>
        <option value="on">オン(○×を押す)</option>
      </select>
    </div>
    <div class="set">
      <label>最後に英語音声</label>
      <select id="autoEn">
        <option value="off" selected>流さない</option>
        <option value="on">終わりぎわに流す</option>
      </select>
    </div>
    <div class="set">
      <label>場面の読み上げ</label>
      <select id="speak">
        <option value="no" selected>しない</option>
        <option value="yes">する</option>
      </select>
    </div>
  </div>

  <div class="note">
    <b>使い方のコツ</b><br>
    ・完璧な英語じゃなくていい。単語1つでも声に出す<br>
    ・思いつかなかったらそれが弱点。答えを見ずに次へ進む<br>
    ・慣れたら「1場面の長さ」を短くして反射速度を上げる<br>
    ・5分やれば50場面以上こなせる。実況より密度が高い
  </div>

  {"cat": "down＝下へ・落ち着く", "scene": "伏せろ", "q": "get ○○", "en": "get down", "jp": "down＝下へ・落ち着く", "ex": [["Get down!", "伏せろ！"], ["Get down, they're shooting!", "伏せろ、撃ってくる！"]]},

  {"cat": "down＝下へ・落ち着く", "scene": "（頭を）低くしとく", "q": "keep ○○", "en": "keep down", "jp": "down＝下へ・落ち着く", "ex": [["Keep your head down.", "目立つな（頭を低くしとけ）"], ["Keep it down, they'll hear us.", "静かに、聞こえるぞ"]]},
  {"cat": "off＝離れる・外れる", "scene": "降りる・離れろ", "q": "get ○○", "en": "get off", "jp": "off＝離れる・外れる", "ex": [["As soon as we get off this boat.", "この船を降りたらすぐ"], ["Get off me!", "離れろ！"]]},
  {"cat": "off＝離れる・外れる", "scene": "消す", "q": "turn ○○", "en": "turn off", "jp": "off＝離れる・外れる", "ex": [["Turn off the air con.", "エアコン消して"], ["Turn off the lights.", "電気消して"]]},
  {"cat": "off＝離れる・外れる", "scene": "外す・脱ぐ", "q": "take ○○", "en": "take off", "jp": "off＝離れる・外れる", "ex": [["You can take them off my hands.", "引き取ってくれていいよ"], ["Take off your mask.", "マスクを外せ"]]},
  {"cat": "off＝離れる・外れる", "scene": "引け・下がれ", "q": "back ○○", "en": "back off", "jp": "off＝離れる・外れる", "ex": [["We saw everything and backed off.", "全部見て、引き下がった"], ["Back off!", "下がれ！"]]},
  {"cat": "around＝まわり・ぶらぶら", "scene": "ふざける", "q": "mess ○○", "en": "mess around", "jp": "around＝まわり・ぶらぶら", "ex": [["I'm just messing around.", "ちょっとふざけてるだけ"], ["Stop messing around!", "ふざけるのやめろ！"]]},
  {"cat": "around＝まわり・ぶらぶら", "scene": "見回す", "q": "look ○○", "en": "look around", "jp": "around＝まわり・ぶらぶら", "ex": [["Hey, no looking around.", "おい、キョロキョロするな"], ["Let me look around.", "ちょっと見回させて"]]},
  {"cat": "around＝まわり・ぶらぶら", "scene": "その辺で待つ", "q": "hang ○○", "en": "hang around", "jp": "around＝まわり・ぶらぶら", "ex": [["We'll hang around.", "その辺で待ってるよ"], ["Don't hang around here.", "ここでうろうろするな"]]},
  {"cat": "away＝遠くへ", "scene": "取り上げる", "q": "take ○○", "en": "take away", "jp": "away＝遠くへ", "ex": [["Are you gonna take it away from us?", "それを俺たちから取り上げるのか？"], ["Take his gun away.", "あいつの銃を取り上げろ"]]},
  {"cat": "through＝通り抜ける", "scene": "経験する・通り抜ける", "q": "go ○○", "en": "go through", "jp": "through＝通り抜ける", "ex": [["I went through that training.", "その訓練を経験した"], ["Go through the gate.", "門を通り抜けろ"]]},
  {"cat": "along＝一緒に・沿って", "scene": "仲良くやる", "q": "get ○○", "en": "get along", "jp": "along＝一緒に・沿って", "ex": [["It makes it easier to get along.", "仲良くやりやすくなる"], ["We don't get along.", "俺たち仲良くない"]]}
];
const SETS = { all: DATA_ALL, core: DATA_CORE, tsukkomi: DATA_TSUKKOMI, verb: DATA_VERB, pair: DATA_PAIR, link: DATA_LINK, particle: DATA_PARTICLE };
let DATA = DATA_ALL;
let active = new Set(DATA.map(d=>d.cat));
let queue = [], qi = 0;
let running = false, timer = null, rafId = null, enTimer = null;
let count = 0;
let current = null;

const stageInner = document.getElementById('stageInner');
const timerfill = document.getElementById('timerfill');
const countEl = document.getElementById('count');
const startBtn = document.getElementById('startBtn');

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function buildChips(){
  const box = document.getElementById('chips');
  box.innerHTML = '';
  const cats = [...new Set(DATA.map(d=>d.cat))];
  // すべて
  const all = document.createElement('div');
  all.className = 'chip' + (active.size === cats.length ? ' on' : '');
  all.textContent = 'すべて';
  all.onclick = () => { active = new Set(cats); buildChips(); rebuild(); };
  box.appendChild(all);
  cats.forEach(c=>{
    const n = DATA.filter(d=>d.cat===c).length;
    const chip = document.createElement('div');
    chip.className = 'chip' + (active.has(c) ? ' on' : '');
    chip.textContent = c + ' (' + n + ')';
    chip.onclick = () => {
      if (active.has(c)) { if (active.size>1) active.delete(c); }
      else active.add(c);
      buildChips(); rebuild();
    };
    box.appendChild(chip);
  });
}

let cycle = 1, lastShown = null;
// 判定モード: 苦手度(言えなかった+1 / 言えた-1)をブラウザに保存
const WEAK_KEY = 'train_weak_v1';
let weak = {};
try { weak = JSON.parse(localStorage.getItem(WEAK_KEY) || '{}'); } catch(e) { weak = {}; }
function saveWeak(){ try { localStorage.setItem(WEAK_KEY, JSON.stringify(weak)); } catch(e) {} }
let retryList = [];          // 同じ周の中ですぐ再出題するもの {item, wait}
let okCount = 0, ngCount = 0;
let waitingJudge = false;
function judgeOn(){ return document.getElementById('judgeMode').value === 'on'; }
// ランダムだけど、苦手なものほど前に来やすいシャッフル
function biasedShuffle(arr){
  if (!judgeOn()) { shuffle(arr); return; }
  const keyed = arr.map(d => ({ d, k: Math.random() - Math.min(weak[d.en] || 0, 5) * 0.25 }));
  keyed.sort((a,b)=>a.k-b.k);
  keyed.forEach((x,i)=>arr[i]=x.d);
}
function rebuild(){
  queue = DATA.filter(d=>active.has(d.cat));
  biasedShuffle(queue);
  retryList = [];
  qi = 0;
  cycle = 1;
  updateProgress();
}
function updateProgress(){
  document.getElementById('cycle').textContent = cycle;
  document.getElementById('done').textContent = qi;
  document.getElementById('total').textContent = queue.length;
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
}

const DIR_COLOR = {'どうする':'#4caf50','ツッコミ・疑問':'#2196f3','後悔・ホッと':'#ff9800','気持ち・強がり':'#e91e63'};
function showLink(item, isRetry){
  const pick = item.nexts[Math.floor(Math.random()*item.nexts.length)];
  item.say = item.first + ' ' + pick.en;
  stageInner.innerHTML =
    '<div class="cat">'+esc(item.cat)+'</div>' + (isRetry ? '<span class="retry-tag">もう一回</span>' : '') +
    '<div style="font-size:15px;color:#aaa;margin-top:6px">場面：'+esc(item.scene)+'</div>' +
    '<div class="en" style="margin-top:12px;font-size:34px;font-weight:bold">① '+esc(item.first)+'</div>' +
    '<div class="jp" style="font-size:16px">'+esc(item.firstJp)+'</div>' +
    '<div class="hint">② 2文目を続けて言う（どうする／ツッコミ／後悔・ホッと／気持ち・強がり）</div>' +
    '<div class="answer" id="ansBox">' +
      item.nexts.map(n =>
        '<div style="margin:6px 0;cursor:pointer" onclick="speakLink(this.dataset.en)" data-en="'+esc(n.en)+'">' +
        '<span style="display:inline-block;min-width:7.5em;padding:2px 8px;margin-right:8px;border-radius:10px;font-size:13px;color:#fff;background:'+(DIR_COLOR[n.d]||'#888')+'">'+esc(n.d)+'</span>' +
        '<span class="en" style="font-size:22px">🔊 '+esc(n.en)+'</span> <span class="jp" style="display:inline">'+esc(n.jp)+'</span></div>'
      ).join('') +
    '</div>';
  count++;
  countEl.textContent = count;
  if (document.getElementById('showAns').value === 'always') revealAnswer();
  if (document.getElementById('speak').value === 'yes') {
    speakJa(item.scene);
    const u = new SpeechSynthesisUtterance(item.first);
    u.lang = 'en-US'; if (enVoice) u.voice = enVoice; u.rate = EN_RATE;
    speechSynthesis.speak(u);
  }
}
function speakLink(en){ if (current && current.first) speakEn(current.first + ' ' + en); }
function showScene(item, isRetry){
  current = item;
  document.querySelector('.stage').classList.remove('waiting');
  if (item.first) { showLink(item, isRetry); return; }
  if (item.q) {   // 句動詞：問題は「get ○○」と日本語だけ。答えに例文2つ
    stageInner.innerHTML = (isRetry ? '<span class="retry-tag">もう一回</span>' : '') +
      '<div class="scene" style="font-size:2.2em;letter-spacing:1px">'+esc(item.q)+'</div>' +
      '<div class="scene">日本語　'+esc(item.scene)+'</div>' +
      '<div class="answer" id="ansBox">' +
        '<div class="en" style="cursor:pointer" onclick="playCurrentEn()">🔊 '+esc(item.en)+'</div>' +
        '<div class="jp">'+esc(item.jp)+'</div>' +
        (item.ex||[]).map(e=>'<div class="jp" style="margin-top:8px">'+esc(e[0])+'<br><span style="opacity:.75">'+esc(e[1])+'</span></div>').join('') +
      '</div>';
    count++; countEl.textContent = count;
    if (document.getElementById('showAns').value === 'always') revealAnswer();
    if (document.getElementById('speak').value === 'yes') speakJa(item.scene);
    return;
  }
  stageInner.innerHTML =
    '<div class="cat">'+esc(item.cat)+'</div>' + (isRetry ? '<span class="retry-tag">もう一回</span>' : '') +
    '<div class="scene">'+esc(item.scene)+'</div>' +
    '<div class="hint">'+(DATA===DATA_TSUKKOMI?'英語でツッコんでみる':DATA===DATA_VERB?'動詞フレーズで言ってみる':DATA===DATA_PAIR?'2文で言ってみる（何が起きた → どうする）':'英語で何か言ってみる')+'</div>' +
    '<div class="answer" id="ansBox">' +
      (item.e1
        ? '<div class="en" style="cursor:pointer" onclick="playCurrentEn()">🔊 ①'+esc(item.e1)+'<br>②'+esc(item.e2)+'</div>' +
          '<div class="jp">①'+esc(item.j1)+'<br>②'+esc(item.j2)+'</div>'
        : '<div class="en" style="cursor:pointer" onclick="playCurrentEn()">🔊 '+esc(item.en)+'</div>' +
          '<div class="jp">'+esc(item.jp)+'</div>') +
    '</div>';
  count++;
  countEl.textContent = count;
  if (document.getElementById('showAns').value === 'always') revealAnswer();
  if (document.getElementById('speak').value === 'yes') speakJa(item.scene);
}

function revealAnswer(){
  const box = document.getElementById('ansBox');
  if (box) box.style.display = 'block';
}

function nextScene(){
  waitingJudge = false;
  if (queue.length === 0) rebuild();
  // 「言えなかった」ものは数問あとにもう一回出す(周の数え方には影響しない)
  retryList.forEach(r => r.wait--);
  const due = retryList.findIndex(r => r.wait <= 0);
  if (due !== -1) {
    const r = retryList.splice(due, 1)[0];
    lastShown = r.item;
    showScene(r.item, true);
    updateProgress();
    startTimer();
    return;
  }
  if (qi >= queue.length) {
    // 全部出し切ったらリセットして新しい順番で2周目へ
    biasedShuffle(queue);
    if (queue.length > 1 && queue[0] === lastShown) {
      const j = 1 + Math.floor(Math.random() * (queue.length - 1));
      [queue[0], queue[j]] = [queue[j], queue[0]];
    }
    qi = 0;
    cycle++;
  }
  lastShown = queue[qi++];
  showScene(lastShown);
  updateProgress();
  startTimer();
}

function startTimer(){
  clearTimeout(timer);
  cancelAnimationFrame(rafId);
  const gap = parseInt(document.getElementById('gap').value);
  const showAns = document.getElementById('showAns').value;
  const t0 = performance.now();
  timerfill.style.width = '100%';
  const tick = (now)=>{
    const p = Math.max(0, 1 - (now - t0)/gap);
    timerfill.style.width = (p*100)+'%';
    if (p > 0 && running) rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);

  if (showAns === 'after'){
    // 残り1.2秒で答えを出す
    const showAt = Math.max(300, gap - 1200);
    setTimeout(()=>{ if(running) revealAnswer(); }, showAt);
  }
  clearTimeout(enTimer);
  if (document.getElementById('autoEn').value === 'on' && current){
    const est = estimateSpeechMs(current.say || current.en);
    // 読み終わりが場面の終わりと重なるように逆算。考える時間は最低4割確保
    const startAt = Math.max(gap * 0.4, gap - est - 250);
    const item = current;
    enTimer = setTimeout(()=>{ if(running && current === item) speakEn(item.say || item.en); }, startAt);
  }
  timer = setTimeout(()=>{ if(running) afterSpeech(()=>{
    if (judgeOn()) {
      waitingJudge = true;
      revealAnswer();
      document.querySelector('.stage').classList.add('waiting');
      const h = document.querySelector('.hint'); if (h) h.textContent = '答えを見て、言えた？ ○ か × を押してね';
    } else if (current && current.first) {
      // つながり：答え(2文目の候補)を出して止まる。英語音声ありの時だけ6秒後に自動で次へ
      revealAnswer();
      const h = document.querySelector('.hint');
      if (document.getElementById('autoEn').value === 'on') {
        if (h) h.textContent = '答えを見て確認（6秒で次へ）';
        const item = current;
        timer = setTimeout(()=>{ if (running && current === item) nextScene(); }, 6000);
      } else {
        waitingJudge = true;
        document.querySelector('.stage').classList.add('waiting');
        if (h) h.textContent = '答えを見て確認 →「次へ」で進む';
      }
    } else nextScene();
  }); }, gap);
}
// 英語の読み上げ中なら終わるまで待ってから次へ(最大4秒)
function afterSpeech(fn){
  if (!enSpeaking) { fn(); return; }
  const t0 = Date.now();
  const iv = setInterval(()=>{
    if (!running) { clearInterval(iv); return; }
    if (!enSpeaking || Date.now() - t0 > 4000) { clearInterval(iv); fn(); }
  }, 100);
}

let jaVoice = null;
let enVoice = null;
function loadVoices(){
  const vs = speechSynthesis.getVoices();
  jaVoice = vs.find(v=>v.lang.startsWith('ja')) || null;
  enVoice = vs.find(v=>v.lang === 'en-US') || vs.find(v=>v.lang.startsWith('en')) || null;
}
loadVoices();
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
function speakJa(text){
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  if (jaVoice) u.voice = jaVoice;
  u.rate = 1.1;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

startBtn.onclick = ()=>{
  running = !running;
  if (running){
    startBtn.textContent = '■ 停止';
    startBtn.classList.remove('main'); startBtn.classList.add('stop');
    if (queue.length === 0) rebuild();
    nextScene();
  } else {
    startBtn.textContent = '▶ 開始';
    startBtn.classList.add('main'); startBtn.classList.remove('stop');
    clearTimeout(timer); clearTimeout(enTimer); cancelAnimationFrame(rafId);
    timerfill.style.width = '100%';
    speechSynthesis.cancel();
    enSpeaking = false;
  }
};

const EN_RATE = 0.9;
let enSpeaking = false;
function speakEn(text){
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  if (enVoice) u.voice = enVoice;
  u.rate = EN_RATE;
  u.onend = ()=>{ enSpeaking = false; };
  u.onerror = ()=>{ enSpeaking = false; };
  speechSynthesis.cancel();
  enSpeaking = true;
  speechSynthesis.speak(u);
}
// 英文の読み上げ時間を文字数から見積もる(ms)
function estimateSpeechMs(text){
  const chars = text.replace(/\s+/g,' ').length;
  const pauses = (text.match(/[.!?,]/g) || []).length;
  return (chars * 65 + pauses * 180) / EN_RATE + 300;
}
function playCurrentEn(){
  if (!current) return;
  revealAnswer();
  speakEn(current.say || current.en);
}
document.getElementById('speakEnBtn').onclick = playCurrentEn;
function judge(ok){
  if (!current) return;
  const en = current.en;
  if (ok) {
    weak[en] = Math.max(0, (weak[en] || 0) - 1);
    okCount++;
  } else {
    weak[en] = (weak[en] || 0) + 1;
    ngCount++;
    // 3〜6問あとにもう一回
    if (!retryList.some(r => r.item === current)) retryList.push({ item: current, wait: 3 + Math.floor(Math.random()*4) });
  }
  saveWeak();
  document.getElementById('judgeStat').textContent = ' ・ ○' + okCount + ' ×' + ngCount;
  clearTimeout(timer); clearTimeout(enTimer);
  nextScene();
}
document.getElementById('judgeOk').onclick = ()=>judge(true);
document.getElementById('judgeNg').onclick = ()=>judge(false);
document.addEventListener('keydown', (ev)=>{
  if (!judgeOn() || !current) return;
  if (ev.key === '1') judge(true);
  if (ev.key === '2') judge(false);
});
function syncJudgeUI(){
  document.getElementById('judgeRow').style.display = judgeOn() ? 'flex' : 'none';
}
document.getElementById('judgeMode').onchange = ()=>{ syncJudgeUI(); if (!judgeOn() && waitingJudge && running) nextScene(); };
syncJudgeUI();
document.getElementById('revealBtn').onclick = revealAnswer;
document.getElementById('showAns').onchange = (ev)=>{ if (ev.target.value === 'always') revealAnswer(); };
document.getElementById('skipBtn').onclick = ()=>{ if(running) nextScene(); else { if(queue.length===0) rebuild(); nextScene(); } };

document.getElementById('setSel').onchange = (ev)=>{
  DATA = SETS[ev.target.value];
  // 2文を言うセットは考える時間を長めに
  const g = document.getElementById('gap');
  if ((ev.target.value === 'pair' || ev.target.value === 'link') && parseInt(g.value) < 8000) g.value = '8000';
  active = new Set(DATA.map(d=>d.cat));
  buildChips(); rebuild();
  if (running) nextScene();
};

buildChips();
rebuild();
</script>
