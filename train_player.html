<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>とっさ訓練 - 場面連続モード</title>
<style>
  :root{--bg:#0f0d0b;--panel:#1a1613;--amber:#ff8c2e;--amber-dim:#7a4518;--text:#f5efe8;--dim:#9a8f83;--green:#4ade80;--red:#ff8080;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;padding:16px;max-width:760px;margin:0 auto;}
  a.back{color:var(--dim);font-size:13px;text-decoration:none;display:inline-block;margin-bottom:12px;}
  .eyebrow{color:var(--dim);font-size:12px;letter-spacing:1px;}
  h1{font-size:24px;margin:4px 0 6px;}
  h1 span{color:var(--amber);}
  .lead{font-size:13px;color:var(--dim);line-height:1.7;margin-bottom:18px;}

  .stage{background:var(--panel);border:2px solid var(--amber-dim);border-radius:18px;
    padding:36px 22px;text-align:center;min-height:230px;display:flex;flex-direction:column;
    justify-content:center;align-items:center;margin-bottom:14px;}
  .cat{display:inline-block;background:rgba(255,140,46,.12);border:1px solid var(--amber-dim);
    color:var(--amber);border-radius:999px;padding:4px 14px;font-size:12px;margin-bottom:18px;}
  .scene{font-size:30px;font-weight:800;line-height:1.5;margin-bottom:14px;}
  .hint{font-size:13px;color:var(--dim);min-height:20px;}
  .answer{margin-top:18px;padding-top:16px;border-top:1px dashed var(--amber-dim);width:100%;display:none;}
  .answer .en{font-size:26px;font-weight:800;color:var(--amber);}
  .answer .jp{font-size:14px;color:var(--dim);margin-top:6px;}
  .idle{font-size:18px;color:var(--dim);}

  .timerbar{height:5px;background:#262019;border-radius:3px;overflow:hidden;margin-bottom:16px;}
  .timerfill{height:100%;background:var(--amber);width:100%;}

  .ctrls{display:flex;gap:10px;justify-content:center;margin-bottom:18px;flex-wrap:wrap;}
  .btn{border:none;border-radius:12px;padding:14px 26px;font-size:16px;font-weight:700;cursor:pointer;}
  .btn.main{background:var(--amber);color:#1a1613;}
  .btn.stop{background:#5a3030;color:#ffb3b3;}
  .btn.sub{background:var(--panel);color:var(--text);border:1px solid var(--amber-dim);font-size:14px;padding:12px 18px;}

  .settings{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:18px;}
  .set{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .set label{font-size:11px;color:var(--dim);}
  .set select{background:var(--panel);color:var(--text);border:1px solid var(--amber-dim);border-radius:8px;padding:6px 10px;font-size:13px;}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px;}
  .chip{background:var(--panel);border:1px solid var(--amber-dim);color:var(--dim);border-radius:999px;padding:7px 13px;font-size:12px;cursor:pointer;}
  .chip.on{background:var(--amber);color:#1a1613;border-color:var(--amber);font-weight:700;}

  .counter{text-align:center;font-size:13px;color:var(--dim);margin-bottom:10px;}
  .note{background:var(--panel);border-radius:12px;padding:14px 16px;font-size:12.5px;color:var(--dim);line-height:1.8;}
  .note b{color:var(--amber);}
</style>
</head>
<body>
  <a class="back" href="index.html">← トップに戻る</a>
  <div class="eyebrow">とっさ訓練 / 場面連続モード</div>
  <h1>とっさに<span>言う</span>訓練</h1>
  <div class="lead">
    場面だけが次々に出ます。答えは出ません。<br>
    表示された瞬間に、思いついた英語を<b>声に出して</b>ください。合っているかは気にしない。止まらず出すことが目的です。
  </div>

  <div class="chips" id="chips"></div>

  <div class="timerbar"><div class="timerfill" id="timerfill"></div></div>

  <div class="stage">
    <div id="stageInner">
      <div class="idle">▶ を押すと場面が流れ始めます</div>
    </div>
  </div>

  <div class="counter"><span id="count">0</span> 場面</div>

  <div class="ctrls">
    <button class="btn main" id="startBtn">▶ 開始</button>
    <button class="btn sub" id="revealBtn">答えを見る</button>
    <button class="btn sub" id="skipBtn">次へ ⏭</button>
  </div>

  <div class="settings">
    <div class="set">
      <label>1場面の長さ</label>
      <select id="gap">
        <option value="3000">3秒(速い)</option>
        <option value="5000" selected>5秒</option>
        <option value="8000">8秒</option>
        <option value="12000">12秒(じっくり)</option>
      </select>
    </div>
    <div class="set">
      <label>答えの表示</label>
      <select id="showAns">
        <option value="never" selected>出さない</option>
        <option value="after">場面の最後に出す</option>
      </select>
    </div>
    <div class="set">
      <label>場面の読み上げ</label>
      <select id="speak">
        <option value="no" selected>しない</option>
        <option value="yes">する</option>
      </select>
    </div>
  </div>

  <div class="note">
    <b>使い方のコツ</b><br>
    ・完璧な英語じゃなくていい。単語1つでも声に出す<br>
    ・思いつかなかったらそれが弱点。答えを見ずに次へ進む<br>
    ・慣れたら「1場面の長さ」を短くして反射速度を上げる<br>
    ・5分やれば50場面以上こなせる。実況より密度が高い
  </div>

<script>
const DATA = [
  {cat:"人を轢く・ぶつける", scene:"通行人を轢いた", en:"Oh no", jp:"やば"},
  {cat:"人を轢く・ぶつける", scene:"自分のミスで迷惑をかけた", en:"My bad", jp:"ごめん、俺のせい"},
  {cat:"人を轢く・ぶつける", scene:"死角から出てきた人を轢いた", en:"I didn't see you", jp:"見えなかった"},
  {cat:"人を轢く・ぶつける", scene:"轢いた相手が倒れている", en:"Are you okay?", jp:"大丈夫？"},
  {cat:"人を轢く・ぶつける", scene:"勝手に飛び出してきた奴にぶつかった", en:"That's your fault", jp:"そっちのせいだろ"},
  {cat:"人を轢く・ぶつける", scene:"曲がりきれず壁に突っ込んだ", en:"I crashed", jp:"ぶつけた"},
  {cat:"人を轢く・ぶつける", scene:"何度もぶつけている", en:"I need to be more careful", jp:"もっと気をつけないと"},
  {cat:"警察に追われる", scene:"パトカーが後ろについた", en:"The cops are after me", jp:"警察に追われてる"},
  {cat:"警察に追われる", scene:"複数のパトカーに追われている", en:"I'm being chased", jp:"追われてる"},
  {cat:"警察に追われる", scene:"路地に入って振り切りたい", en:"Lose the cops", jp:"警察をまく"},
  {cat:"警察に追われる", scene:"ギリギリで切り抜けた", en:"That was close", jp:"危なかった"},
  {cat:"警察に追われる", scene:"警察に囲まれそうだ", en:"I need to get out of here", jp:"ここから出ないと"},
  {cat:"警察に追われる", scene:"逃げ切った直後にまた警察", en:"Oh come on", jp:"うわ最悪"},
  {cat:"分からない", scene:"何が起きているか分からない", en:"I have no idea what's going on", jp:"何が起きてるか分からん"},
  {cat:"分からない", scene:"英語の指示が読めない", en:"I have no idea what this means", jp:"意味が全然分からん"},
  {cat:"分からない", scene:"NPCの英語が一言も聞き取れなかった", en:"I understood none of that", jp:"一言も分からなかった"},
  {cat:"分からない", scene:"分かってないが頷いて進む", en:"I'm going to pretend I understood that", jp:"分かったフリをする"},
  {cat:"分からない", scene:"選択肢の意味が分からない", en:"I'll just say yes and hope for the best", jp:"とりあえずYESにして祈る"},
  {cat:"分からない", scene:"指示通りやったのに失敗した", en:"I might have misunderstood", jp:"間違えたかも"},
  {cat:"分からない", scene:"指示を推測してみる", en:"Let me guess", jp:"当ててみよう"},
  {cat:"操作が分からない", scene:"正解が分からないので何か試す", en:"Let me just try something", jp:"ちょっと試してみる"},
  {cat:"操作が分からない", scene:"思いついた方法を試す直前", en:"Let's see if this works", jp:"うまくいくか試す"},
  {cat:"操作が分からない", scene:"走り方・銃の構え方が分からない", en:"How do I do this?", jp:"これどうやるの？"},
  {cat:"操作が分からない", scene:"何を押しても動かない", en:"Nothing is working", jp:"何もうまくいかない"},
  {cat:"操作が分からない", scene:"操作方法が分かった", en:"I figured it out", jp:"分かった"},
  {cat:"操作が分からない", scene:"失敗してもう一回挑戦", en:"Let's try again", jp:"もう一回"},
  {cat:"道が分からない", scene:"着いたが次に何をすべきか不明", en:"What am I supposed to do here?", jp:"ここで何すればいい？"},
  {cat:"道が分からない", scene:"道が分からず適当に進む", en:"I'll just go this way", jp:"とりあえずこっち行く"},
  {cat:"道が分からない", scene:"違う道に入ってしまった", en:"I took a wrong turn", jp:"曲がるとこ間違えた"},
  {cat:"道が分からない", scene:"曲がる交差点を通り過ぎた", en:"I missed the turn", jp:"曲がり損ねた"},
  {cat:"道が分からない", scene:"自分がどこにいるか分からない", en:"I'm completely lost", jp:"完全に迷った"},
  {cat:"道が分からない", scene:"移動が長すぎてうんざり", en:"This is taking forever", jp:"全然終わらん"},
  {cat:"暴れる・挑発", scene:"通行人や車が道を塞いでいる", en:"Get out of the way", jp:"どけ"},
  {cat:"暴れる・挑発", scene:"敵に囲まれて迎え撃つ", en:"Bring it on", jp:"かかってこい"},
  {cat:"暴れる・挑発", scene:"相手が近づいてくる", en:"Back off", jp:"近寄るな"},
  {cat:"暴れる・挑発", scene:"相手に危険が迫っている", en:"Watch out", jp:"危ない"},
  {cat:"暴れる・挑発", scene:"うまくいって勢いに乗る", en:"Let's go!", jp:"よっしゃ！"},
  {cat:"暴れる・挑発", scene:"暴れて周囲が大混乱", en:"This is a mess", jp:"めちゃくちゃだ"},
  {cat:"間をつなぐ", scene:"次に何を話すか考えている", en:"Okay so...", jp:"えーっと"},
  {cat:"間をつなぐ", scene:"何かに気づいて動きを止めたい", en:"Hold on", jp:"ちょっと待って"},
  {cat:"間をつなぐ", scene:"判断に迷っている", en:"Let me think", jp:"考えさせて"},
  {cat:"間をつなぐ", scene:"画面やマップを確認する", en:"Let's see", jp:"見てみよう"},
  {cat:"間をつなぐ", scene:"一瞬で状況が変わった", en:"Wait, what?", jp:"え、何？"},
  {cat:"間をつなぐ", scene:"いよいよ何かを始める", en:"Here we go", jp:"行くぞ"},
  {cat:"間をつなぐ", scene:"一区切りついて次へ", en:"Alright", jp:"よし"},
  {cat:"成功・失敗", scene:"試したことが成功した", en:"It worked", jp:"うまくいった"},
  {cat:"成功・失敗", scene:"無茶が意外にも成功した", en:"That actually worked", jp:"意外とうまくいった"},
  {cat:"成功・失敗", scene:"ギリギリで到着・クリアした", en:"I made it", jp:"やり遂げた"},
  {cat:"成功・失敗", scene:"簡単な操作をミスした", en:"I messed up", jp:"やらかした"},
  {cat:"成功・失敗", scene:"判断が悪かったと気づいた", en:"That was a mistake", jp:"あれは間違いだった"},
  {cat:"成功・失敗", scene:"失敗したが挑戦はした", en:"At least I tried", jp:"まあ挑戦はした"},
  {cat:"成功・失敗", scene:"引きずらず次に進む", en:"Moving on", jp:"次いこう"},
];
let active = new Set(DATA.map(d=>d.cat));
let queue = [], qi = 0;
let running = false, timer = null, rafId = null;
let count = 0;
let current = null;

const stageInner = document.getElementById('stageInner');
const timerfill = document.getElementById('timerfill');
const countEl = document.getElementById('count');
const startBtn = document.getElementById('startBtn');

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function buildChips(){
  const box = document.getElementById('chips');
  box.innerHTML = '';
  const cats = [...new Set(DATA.map(d=>d.cat))];
  // すべて
  const all = document.createElement('div');
  all.className = 'chip' + (active.size === cats.length ? ' on' : '');
  all.textContent = 'すべて';
  all.onclick = () => { active = new Set(cats); buildChips(); rebuild(); };
  box.appendChild(all);
  cats.forEach(c=>{
    const n = DATA.filter(d=>d.cat===c).length;
    const chip = document.createElement('div');
    chip.className = 'chip' + (active.has(c) ? ' on' : '');
    chip.textContent = c + ' (' + n + ')';
    chip.onclick = () => {
      if (active.has(c)) { if (active.size>1) active.delete(c); }
      else active.add(c);
      buildChips(); rebuild();
    };
    box.appendChild(chip);
  });
}

function rebuild(){
  queue = DATA.filter(d=>active.has(d.cat));
  shuffle(queue);
  qi = 0;
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
}

function showScene(item){
  current = item;
  stageInner.innerHTML =
    '<div class="cat">'+esc(item.cat)+'</div>' +
    '<div class="scene">'+esc(item.scene)+'</div>' +
    '<div class="hint">英語で何か言ってみる</div>' +
    '<div class="answer" id="ansBox">' +
      '<div class="en">'+esc(item.en)+'</div>' +
      '<div class="jp">'+esc(item.jp)+'</div>' +
    '</div>';
  count++;
  countEl.textContent = count;
  if (document.getElementById('speak').value === 'yes') speakJa(item.scene);
}

function revealAnswer(){
  const box = document.getElementById('ansBox');
  if (box) box.style.display = 'block';
}

function nextScene(){
  if (queue.length === 0) rebuild();
  if (qi >= queue.length) { shuffle(queue); qi = 0; }
  showScene(queue[qi++]);
  startTimer();
}

function startTimer(){
  clearTimeout(timer);
  cancelAnimationFrame(rafId);
  const gap = parseInt(document.getElementById('gap').value);
  const showAns = document.getElementById('showAns').value;
  const t0 = performance.now();
  timerfill.style.width = '100%';
  const tick = (now)=>{
    const p = Math.max(0, 1 - (now - t0)/gap);
    timerfill.style.width = (p*100)+'%';
    if (p > 0 && running) rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);

  if (showAns === 'after'){
    // 残り1.2秒で答えを出す
    const showAt = Math.max(300, gap - 1200);
    setTimeout(()=>{ if(running) revealAnswer(); }, showAt);
  }
  timer = setTimeout(()=>{ if(running) nextScene(); }, gap);
}

let jaVoice = null;
function loadVoices(){
  const vs = speechSynthesis.getVoices();
  jaVoice = vs.find(v=>v.lang.startsWith('ja')) || null;
}
loadVoices();
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
function speakJa(text){
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  if (jaVoice) u.voice = jaVoice;
  u.rate = 1.1;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

startBtn.onclick = ()=>{
  running = !running;
  if (running){
    startBtn.textContent = '■ 停止';
    startBtn.classList.remove('main'); startBtn.classList.add('stop');
    if (queue.length === 0) rebuild();
    nextScene();
  } else {
    startBtn.textContent = '▶ 開始';
    startBtn.classList.add('main'); startBtn.classList.remove('stop');
    clearTimeout(timer); cancelAnimationFrame(rafId);
    timerfill.style.width = '100%';
    speechSynthesis.cancel();
  }
};

document.getElementById('revealBtn').onclick = revealAnswer;
document.getElementById('skipBtn').onclick = ()=>{ if(running) nextScene(); else { if(queue.length===0) rebuild(); nextScene(); } };

buildChips();
rebuild();
</script>
</body>
</html>
